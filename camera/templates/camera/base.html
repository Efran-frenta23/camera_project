<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Camera Project{% endblock %}</title>
    <style>
        :root {
            --primary: #0d6e6a;
            --primary-dark: #0a5450;
            --primary-soft: #d6efed;
            --coral: #f9776a;
            --amber: #f59e0b;
            --bg: #fafaf9;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --danger: #dc2626;
            --success: #16a34a;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.06);
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--text);
            background: var(--bg);
            line-height: 1.5;
        }
        a { color: var(--primary); text-decoration: none; }
        a:hover { color: var(--primary-dark); }
        h1, h2, h3 { margin: 0 0 12px; font-weight: 700; letter-spacing: -0.01em; }
        h1 { font-size: 28px; }
        h2 { font-size: 20px; }

        .header {
            position: sticky;
            top: 0;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }
        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 18px;
            color: var(--text);
        }
        .brand-mark {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--primary), var(--coral));
        }
        .header-actions a {
            margin-left: 16px;
            font-size: 14px;
            color: var(--muted);
        }
        .header-actions a:hover { color: var(--text); }

        .layout {
            max-width: 1200px;
            margin: 0 auto;
            padding: 28px 24px;
            display: grid;
            grid-template-columns: 1fr 260px;
            gap: 24px;
            align-items: start;
        }
        @media (max-width: 880px) {
            .layout { grid-template-columns: 1fr; }
        }

        main { min-width: 0; }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
        }
        .card + .card { margin-top: 20px; }

        .sidebar {
            position: sticky;
            top: 88px;
        }
        .nav {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 8px;
            box-shadow: var(--shadow);
        }
        .nav-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
            padding: 10px 12px 6px;
        }
        .nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            color: var(--text);
            font-size: 14px;
            font-weight: 500;
        }
        .nav a:hover { background: var(--primary-soft); color: var(--primary-dark); }
        .nav a.active { background: var(--primary); color: #fff; }
        .nav a.active:hover { background: var(--primary-dark); color: #fff; }
        .nav-icon {
            width: 18px; height: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            padding: 9px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-ghost { background: transparent; color: var(--text); border-color: var(--border); }
        .btn-ghost:hover { background: var(--bg); border-color: var(--muted); }
        .btn-danger { background: #fff; color: var(--danger); border-color: var(--border); }
        .btn-danger:hover { background: #fef2f2; border-color: var(--danger); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .field label {
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
        }
        .select {
            padding: 9px 12px;
            font-size: 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: #fff;
            font-family: inherit;
            color: var(--text);
        }
        .select:focus { outline: 2px solid var(--primary-soft); border-color: var(--primary); }

        .row {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            background: var(--bg);
            border: 1px solid var(--border);
            font-size: 14px;
        }
        .status-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: var(--muted);
            flex-shrink: 0;
        }
        .status-bar.is-live .status-dot {
            background: var(--success);
            box-shadow: 0 0 0 4px rgba(22,163,74,0.18);
        }
        .status-label { font-weight: 600; }
        .status-meta { color: var(--muted); }

        .stream-frame {
            margin-top: 18px;
            border-radius: var(--radius);
            overflow: hidden;
            background: #0b0e12;
            aspect-ratio: 4 / 3;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6b7280;
            font-size: 14px;
        }
        .stream-frame img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .stream-empty { padding: 20px; text-align: center; }

        .muted { color: var(--muted); font-size: 14px; }
        .stack > * + * { margin-top: 16px; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="{% url 'index' %}" class="brand">
                <span class="brand-mark"></span>
                <span>Camera Project</span>
            </a>
            <nav class="header-actions">
                <a href="/admin/">Admin</a>
            </nav>
        </div>
    </header>

    <div class="layout">
        <main>
            {% block main %}{% endblock %}
        </main>
        <aside class="sidebar">
            <div class="nav">
                <div class="nav-title">Navigasi</div>
                <a href="{% url 'index' %}" class="{% if active_page == 'index' %}active{% endif %}">
                    <span class="nav-icon">●</span> Kontrol
                </a>
                <a href="{% url 'livestream' %}" class="{% if active_page == 'livestream' %}active{% endif %}">
                    <span class="nav-icon">▶</span> Live Stream
                </a>
                <a href="{% url 'video_history' %}" class="{% if active_page == 'history' %}active{% endif %}">
                    <span class="nav-icon">▦</span> Riwayat Rekaman
                </a>
            </div>
        </aside>
    </div>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
